name: 更新CF优选IP

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update-cf-ip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run script
        run: python3 scripts/cf_ip.py

      - name: Commit and push
        run: |
          git config user.name "zjt37"
          git config user.email "27096491@qq.com"
          git add cf_ips.txt
          if git diff --cached --quiet; then
            echo "No changes, skip"
          else
            git commit -m "Update CF IPs $(date -u +'%Y-%m-%d %H:%M')"
            git push
          fi

      - name: Delete previous run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          API="https://api.github.com/repos/${{ github.repository }}/actions/runs"
          curl -s -H "Authorization: token $GH_TOKEN" "$API?per_page=10" > /tmp/all.json
          echo "Getting run list..."
          python3 -c "
          import json
          d = json.load(open('/tmp/all.json'))
          runs = [r for r in d.get('workflow_runs', []) if r.get('name') == '更新CF优选IP']
          runs.sort(key=lambda r: r['created_at'])
          for r in runs[:-1]:
              print(r['id'])
          " > /tmp/to_delete.txt
          while read rid; do
            [ -z "$rid" ] && continue
            echo "Deleting run $rid"
            curl -s -X DELETE -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$rid"
          done < /tmp/to_delete.txt
